name: Self Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Exercise the supported floor and latest stable on every supported
        # runner so path and filesystem assumptions remain portable.
        python-version: ['3.9', '3.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Keep every matrix result bound to the same submitted commit. For
          # pull requests, do not mix GitHub's temporary merge ref with the
          # contributor commit embedded in the runtime manifest.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate audit and release-report contract
        run: python -S scripts/validate_audit_contract.py

      - name: Run source-only release tests
        run: python -S scripts/run_source_tests.py

      - name: Build committed runtime archive
        run: python -S scripts/package_skill.py build --revision HEAD --output dist/skill-forge.zip

      - name: Verify archive integrity, source proof, and canonical profiles
        run: python -S scripts/package_skill.py verify dist/skill-forge.zip --json --source-repo .

      - name: Extract verified runtime archive
        run: python -S -m zipfile -e dist/skill-forge.zip extracted

      - name: Run regression tests from the extracted runtime
        run: python -S extracted/skill-forge/scripts/run_self_tests.py
