name: Release Skill

on:
  push:
    tags:
      # GitHub Actions tag filters are globs, not SemVer regular expressions.
      # The release-metadata gate below enforces vMAJOR.MINOR.PATCH exactly.
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    name: Build and validate runtime archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the committed release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Tag events expose the peeled commit as github.sha. Checking out that
          # commit avoids actions/checkout replacing an annotated tag ref with a
          # lightweight ref during its final fetch.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore and prove annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || true)"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          head_commit="$(git rev-parse HEAD)"
          printf 'release_tag=%s object_type=%s tag_commit=%s head=%s\n' \
            "${RELEASE_TAG}" "${tag_type}" "${tag_commit}" "${head_commit}"
          test "${tag_type}" = "tag"
          test "${tag_commit}" = "${head_commit}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: python -S scripts/release_skill.py --verify-tag "${GITHUB_REF_NAME}"

      - name: Build the committed runtime archive
        run: |
          mkdir -p dist
          python -S scripts/package_skill.py build --revision HEAD --output dist/skill-forge.zip
          (
            cd dist
            sha256sum skill-forge.zip > skill-forge.zip.sha256
          )

      - name: Validate source-only release tooling
        run: |
          python -S scripts/validate_audit_contract.py
          python -S scripts/run_source_tests.py

      - name: Verify archive integrity, source proof, and canonical profiles
        run: python -S scripts/package_skill.py verify dist/skill-forge.zip --json --source-repo .

      - name: Extract verified runtime archive
        run: python -S -m zipfile -e dist/skill-forge.zip extracted

      - name: Run regression tests from the extracted runtime
        run: python -S extracted/skill-forge/scripts/run_self_tests.py

      - name: Generate committed release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -S scripts/generate_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output dist/RELEASE_NOTES.md

      - name: Upload validated runtime archive and checksum
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-forge-runtime
          path: |
            dist/skill-forge.zip
            dist/skill-forge.zip.sha256
          if-no-files-found: error

      - name: Upload validated release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-forge-release-assets
          path: |
            dist/skill-forge.zip
            dist/skill-forge.zip.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    name: Publish validated release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-forge-release-assets
          path: dist

      - name: Create GitHub Release with ZIP and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/skill-forge.zip \
            dist/skill-forge.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "skill-forge ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md
